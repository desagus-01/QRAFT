[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qraft"
version = "0.1.0"
description = "Quantitative Risk, Allocation, and Forecasting Toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=8.0.0",
    "copulae>=0.8.0",
    "cvxportfolio>=1.5.1",
    "cvxpy>=1.7.3",
    "databento>=0.63.0",
    "dotenv>=0.9.9",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.6",
    "memray>=1.19.3",
    "numpy>=2.3.3",
    "polars>=1.33.1",
    "pre-commit>=4.3.0",
    "pydantic>=2.11.7",
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "scipy>=1.16.1",
    "scipy-stubs>=1.16.3.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "types-requests>=2.33.0.20260518",
]

[tool.setuptools.packages.find]
where = ["."]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running backtest/optimization tests",
]


[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D"]
"qraft/**/__init__.py" = ["D104"]
"qraft/**/engine/**" = ["D"]
"qraft/forecast/time_series/**" = ["D"]
"qraft/forecast/simulation/engines/**" = ["D"]
"qraft/core/estimation.py" = ["D"]
"qraft/core/cadence.py" = ["D"]
"qraft/core/weights.py" = ["D"]
"qraft/core/metrics.py" = ["D103"]
"qraft/core/panel.py" = ["D"]
"qraft/core/probability/**" = ["D"]
"qraft/core/scenarios/__init__.py" = ["D"]
"qraft/core/scenarios/copula_marginal.py" = ["D"]
"qraft/core/scenarios/transforms.py" = ["D101", "D102", "D103"]
"qraft/core/scenarios/view_types.py" = ["D101"]
"qraft/core/snapshot.py" = ["D"]
"qraft/backtest/configs.py" = ["D"]
"qraft/backtest/costs.py" = ["D"]
"qraft/backtest/engine/**" = ["D"]
"qraft/backtest/baselines.py" = ["D"]
"qraft/backtest/execution.py" = ["D"]
"qraft/backtest/inputs.py" = ["D"]
"qraft/backtest/result/result.py" = ["D103"]
"qraft/backtest/result/summary.py" = ["D102", "D103"]
"qraft/backtest/selection/candidate_eval.py" = ["D"]
"qraft/backtest/selection/candidates.py" = ["D"]
"qraft/backtest/selection/diagnostics.py" = ["D"]
"qraft/backtest/selection/grid_eval.py" = ["D"]
"qraft/backtest/selection/overlays.py" = ["D"]
"qraft/backtest/selection/reports.py" = ["D"]
"qraft/backtest/selection/results.py" = ["D"]
"qraft/backtest/selection/scoring.py" = ["D"]
"qraft/backtest/selection/select.py" = ["D"]
"qraft/backtest/selection/significance.py" = ["D"]
"qraft/backtest/selection/splits.py" = ["D"]
"qraft/backtest/selection/validation.py" = ["D102", "D103"]
"qraft/backtest/selection/validation_runs.py" = ["D"]
"qraft/construction/inputs.py" = ["D"]
"qraft/construction/market_snapshot.py" = ["D"]
"qraft/construction/optimization/constraints.py" = ["D102", "D107"]
"qraft/construction/optimization/diagnostics.py" = ["D"]
"qraft/construction/optimization/inputs.py" = ["D101", "D102", "D103"]
"qraft/construction/optimization/objectives/**" = ["D"]
"qraft/construction/optimization/optimization.py" = ["D101", "D102"]
"qraft/construction/optimization/presets.py" = ["D"]
"qraft/construction/optimization/problem.py" = ["D102"]
"qraft/construction/policies/allocation.py" = ["D102"]
"qraft/construction/policies/policies.py" = ["D102"]
"qraft/construction/policies/policy_decision.py" = ["D107"]
"qraft/construction/policies/policy_projection.py" = ["D102", "D103"]
"qraft/construction/state.py" = ["D"]
"qraft/forecast/pipelines/**" = ["D"]
"qraft/forecast/plotting.py" = ["D"]
"qraft/forecast/signals/**" = ["D"]
"qraft/forecast/simulation/simulate_paths.py" = ["D"]
"qraft/forecast/simulation/variance_cap_validation.py" = ["D"]
"qraft/risk/factor_ols.py" = ["D103"]
"qraft/risk/performance_attribution.py" = ["D102"]
"qraft/risk/risk_attribution.py" = ["D102", "D103"]
"qraft/utils/**" = ["D"]
"qraft/globals.py" = ["D"]
"qraft/helper.py" = ["D"]


[tool.pyrefly]
python_version = "3.13"
search_path = ["."]
project-includes = [
  "**/*.py",
  "**/*.pyi",
  "**/*.ipynb",
]
project-excludes = [
  ".venv/**",
  "venv/**",
  "**/__pycache__/**",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
