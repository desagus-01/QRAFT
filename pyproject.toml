[project]
name = "qraft"
version = "0.1.0"
description = "Quantitative Risk, Allocation, and Forecasting Toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=8.0.0",
    "copulae>=0.8.0",
    "cvxpy>=1.7.3",
    "databento>=0.63.0",
    "dotenv>=0.9.9",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "polars>=1.33.1",
    "pre-commit>=4.3.0",
    "pydantic>=2.11.7",
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "scipy>=1.16.1",
    "scipy-stubs>=1.16.3.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "types-requests>=2.33.0.20260518",
]

[tool.setuptools.packages.find]
where = ["qraft"]


# [tool.basedpyright]
# typeCheckingMode = "recommended"
# failOnWarnings = false
# allowedUntypedLibraries = ['pydantic', 'requests']
# reportExplicitAny = false
# reportAny = false
# reportMissingTypeStubs = false
#

[tool.pyrefly]
python_version = "3.13"
search_path = ["qraft"]
project-includes = [
  "**/*.py",
  "**/*.pyi",
  "**/*.ipynb",
]
project-excludes = [
  ".venv/**",
  "venv/**",
  "**/__pycache__/**",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

